name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: mingw (windres for the exe icon)
        continue-on-error: true
        run: choco install mingw --no-progress -y

      - name: build
        run: cargo build --release --locked

      - name: test
        run: cargo test --release --locked

      - name: pack
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\neonsend.exe dist\neonsend.exe
          Copy-Item README.md,LICENSE dist\

      - uses: actions/upload-artifact@v4
        with:
          name: neonsend-windows-x64
          path: dist

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/neonsend.exe
          generate_release_notes: true
